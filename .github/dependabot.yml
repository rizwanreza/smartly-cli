version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site-deps:
        patterns: ["*"]
    # Astro majors are deliberately NOT ignored. They were once, and the site
    # drifted two majors behind until a batch of high-severity advisories had
    # no non-breaking fix. The `site` job in ci.yml builds every PR, so a bot
    # major that breaks the build fails visibly rather than merging quietly.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

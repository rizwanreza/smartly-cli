version: 2

project_name: smartly

builds:
  - id: smartly
    main: ./cmd/smartly
    binary: smartly
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/rizwanreza/smartly-cli/internal/cli.Version={{.Version}}

archives:
  - id: smartly
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Documentation and site
      regexp: '^(docs|site)'
      order: 2
    - title: Everything else
      order: 999
  filters:
    exclude:
      - "^test:"
      - "^chore\\(deps\\)"
      - "^Merge "

# Publishing the cask needs write access to the tap repo, which the release
# workflow's default GITHUB_TOKEN does not have. Until a HOMEBREW_TAP_TOKEN
# secret exists (a fine-grained PAT with contents:write on
# rizwanreza/homebrew-tap), the cask file is still generated into dist/ but
# not pushed — the release itself succeeds either way.
homebrew_casks:
  - name: smartly
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_TOKEN" "" }}false{{ else }}true{{ end }}'
    repository:
      owner: rizwanreza
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    directory: Casks
    homepage: "https://github.com/rizwanreza/smartly-cli"
    description: "Turn an English sentence into an executable shell command"
    license: "MIT"
    binaries:
      - smartly
    caveats: |
      smartly's binaries are not yet signed with an Apple Developer ID. If
      you installed without --no-quarantine, macOS Gatekeeper will block the
      binary — do NOT click "Move to Trash"; instead run:

        xattr -d com.apple.quarantine "$(brew --prefix)/Caskroom/smartly/"*/smartly

      Run `smartly config init` to write a default config, and
      `eval "$(smartly init bash)"` (or `init zsh`) in your shell rc file
      to enable commands that change directory or set environment variables.

# Every release page opens like an announcement: what this is, how to
# install it, where the docs are — then the grouped changelog, then a
# compare link. A hand-written announcement in docs/releases/<tag>.md
# replaces the changelog section entirely (see release.yml).
release:
  github:
    owner: rizwanreza
    name: smartly-cli
  header: |
    Tell your shell what you mean. smartly {{ .Version }} turns a plain
    English sentence into one executable shell command.

    **Install**

    ```
    go install github.com/rizwanreza/smartly-cli/cmd/smartly@{{ .Tag }}
    ```

    Or download a binary below (macOS and Linux, amd64 and arm64 — verify
    with `checksums.txt`).

    Docs: https://rizwanreza.github.io/smartly-cli/
  footer: |
    ---

    **Full diff**: https://github.com/rizwanreza/smartly-cli/compare/{{ .PreviousTag }}...{{ .Tag }}

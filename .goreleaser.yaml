version: 2

project_name: smartly

builds:
  - id: smartly
    main: ./cmd/smartly
    binary: smartly
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/rizwanreza/smartly-cli/internal/cli.Version={{.Version}}

archives:
  - id: smartly
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

# Signs and notarizes the darwin binaries with Apple's notary service,
# entirely on the Linux CI runner (goreleaser uses quill — no Mac needed).
# Skipped entirely if the MACOS_* secrets are absent (a fork's CI, say) —
# the release still succeeds, it just ships binaries Gatekeeper will block.
#   MACOS_SIGN_P12         base64 of the Developer ID Application .p12
#   MACOS_SIGN_PASSWORD    the .p12 export password
#   MACOS_NOTARY_ISSUER_ID App Store Connect API key issuer UUID
#   MACOS_NOTARY_KEY_ID    App Store Connect API key ID
#   MACOS_NOTARY_KEY       base64 of the App Store Connect .p8 key
notarize:
  macos:
    - enabled: '{{ if envOrDefault "MACOS_SIGN_P12" "" }}true{{ else }}false{{ end }}'
      ids: [smartly]
      sign:
        certificate: "{{ envOrDefault \"MACOS_SIGN_P12\" \"\" }}"
        password: "{{ envOrDefault \"MACOS_SIGN_PASSWORD\" \"\" }}"
      notarize:
        issuer_id: "{{ envOrDefault \"MACOS_NOTARY_ISSUER_ID\" \"\" }}"
        key_id: "{{ envOrDefault \"MACOS_NOTARY_KEY_ID\" \"\" }}"
        key: "{{ envOrDefault \"MACOS_NOTARY_KEY\" \"\" }}"
        wait: true

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Documentation and site
      regexp: '^(docs|site)'
      order: 2
    - title: Everything else
      order: 999
  filters:
    exclude:
      - "^test:"
      - "^chore\\(deps\\)"
      - "^Merge "

# The cask is pushed to the tap over SSH using a write-scoped deploy key
# (repo secret HOMEBREW_TAP_DEPLOY_KEY) — deliberately not a PAT, since a
# deploy key grants write to exactly one repository and nothing else. If
# the secret is ever absent the cask is still generated into dist/ but not
# pushed, and the release itself succeeds.
homebrew_casks:
  - name: smartly
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_DEPLOY_KEY" "" }}false{{ else }}true{{ end }}'
    repository:
      owner: rizwanreza
      name: homebrew-tap
      git:
        url: git@github.com:rizwanreza/homebrew-tap.git
        private_key: '{{ envOrDefault "HOMEBREW_TAP_DEPLOY_KEY" "" }}'
    directory: Casks
    homepage: "https://smartlycli.com/"
    description: "Turn an English sentence into an executable shell command"
    license: "MIT"
    binaries:
      - smartly
    caveats: |
      Run `smartly config init` to write a default config, and
      `eval "$(smartly init bash)"` (or `init zsh`) in your shell rc file
      to enable commands that change directory or set environment variables.

# Every release page opens like an announcement: what this is, how to
# install it, where the docs are — then the grouped changelog, then a
# compare link. A hand-written announcement in docs/releases/<tag>.md
# replaces the changelog section entirely (see release.yml).
release:
  github:
    owner: rizwanreza
    name: smartly-cli
  header: |
    Tell your shell what you mean. smartly {{ .Version }} turns a plain
    English sentence into one executable shell command.

    **Install**

    ```
    go install github.com/rizwanreza/smartly-cli/cmd/smartly@{{ .Tag }}
    ```

    Or download a binary below (macOS and Linux, amd64 and arm64 — verify
    with `checksums.txt`).

    Docs: https://smartlycli.com/
  footer: |
    ---

    **Full diff**: https://github.com/rizwanreza/smartly-cli/compare/{{ .PreviousTag }}...{{ .Tag }}

  <path fill="#00ddf5" d="m 641,153 h 22 c 3.324,0 6,2.676 6,6 0,3.324 -2.676,6 -6,6 h -22 c -3.324,0 -6,-2.676 -6,-6 0,-3.324 2.676,-6 6,-6 z"/>
